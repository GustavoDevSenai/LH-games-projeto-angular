<main>

  <section id="section-login">

    <h1>Login</h1>

    <form>

      <div class="campo">

        <label for="usuario">
          Email
        </label>

        <input
          name="usuario"
          type="text"
          class="form-control"
          required
          [(ngModel)]="usuario"
          placeholder="Digite seu email">

      </div>


      <div class="campo">

        <label for="password">
          Senha
        </label>

        <input
          name="password"
          type="password"
          class="form-control"
          required
          [(ngModel)]="senha"
          placeholder="Digite sua senha">

      </div>


      <button
        type="button"
        class="btn-login"
        (click)="fazerLogin()">

        Entrar

      </button>


    </form>

  </section>

</main>
